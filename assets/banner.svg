<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="title desc">
  <title id="title">graphemely: truncate, slice and count strings with emoji safely in JavaScript</title>
  <desc id="desc">Gem the cat next to the graphemely name. Native str.slice(0, 3) cuts a family emoji and leaves a broken replacement character, while slice(str, 0, 3) from graphemely keeps the whole family emoji.</desc>
  <rect width="1280" height="440" rx="28" fill="#F7F5FF"/>
  <g transform="translate(36 30) scale(0.95)">
  <!-- tail -->
  <path d="M108 318 C 52 312 40 250 78 222" fill="none" stroke="#7B6CF6" stroke-width="26" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="170" cy="292" rx="92" ry="82" fill="#7B6CF6"/>
  <ellipse cx="170" cy="310" rx="54" ry="56" fill="#EEEBFF"/>
  <!-- collar with a little gem -->
  <path d="M112 236 Q170 266 228 236" fill="none" stroke="#FF6F91" stroke-width="12" stroke-linecap="round"/>
  <path d="M170 252 L184 266 L170 284 L156 266 Z" fill="#FF6F91" stroke="#FF6F91" stroke-width="4" stroke-linejoin="round"/>
  <path d="M158 266 H182 M170 254 V282" fill="none" stroke="#EEEBFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <!-- ears -->
  <path d="M96 130 L92 52 Q94 44 102 48 L160 92 Z" fill="#7B6CF6" stroke="#7B6CF6" stroke-width="10" stroke-linejoin="round"/>
  <path d="M244 130 L248 52 Q246 44 238 48 L180 92 Z" fill="#7B6CF6" stroke="#7B6CF6" stroke-width="10" stroke-linejoin="round"/>
  <path d="M108 112 L106 72 L140 98 Z" fill="#FF6F91" stroke="#FF6F91" stroke-width="6" stroke-linejoin="round"/>
  <path d="M232 112 L234 72 L200 98 Z" fill="#FF6F91" stroke="#FF6F91" stroke-width="6" stroke-linejoin="round"/>
  <!-- head -->
  <ellipse cx="170" cy="160" rx="96" ry="82" fill="#7B6CF6"/>
  <ellipse cx="170" cy="190" rx="46" ry="32" fill="#EEEBFF"/>
  <!-- eyes -->
  <ellipse cx="132" cy="152" rx="12" ry="15" fill="#231F3A"/>
  <ellipse cx="208" cy="152" rx="12" ry="15" fill="#231F3A"/>
  <circle cx="136" cy="146" r="4.5" fill="#EEEBFF"/>
  <circle cx="212" cy="146" r="4.5" fill="#EEEBFF"/>
  <!-- cheeks -->
  <ellipse cx="108" cy="184" rx="13" ry="8" fill="#FF6F91" opacity="0.55"/>
  <ellipse cx="232" cy="184" rx="13" ry="8" fill="#FF6F91" opacity="0.55"/>
  <!-- nose and mouth -->
  <path d="M161 176 H179 L170 186 Z" fill="#FF6F91" stroke="#FF6F91" stroke-width="4" stroke-linejoin="round"/>
  <path d="M170 187 V194 M170 194 Q162 203 153 196 M170 194 Q178 203 187 196" fill="none" stroke="#231F3A" stroke-width="4" stroke-linecap="round"/>
  <!-- front paws -->
  <ellipse cx="138" cy="366" rx="24" ry="14" fill="#EEEBFF"/>
  <ellipse cx="200" cy="366" rx="24" ry="14" fill="#EEEBFF"/>
  <!-- raised paw holding the thread -->
  <path d="M236 270 C 256 248 270 236 286 228" fill="none" stroke="#7B6CF6" stroke-width="30" stroke-linecap="round"/>
  <circle cx="290" cy="226" r="19" fill="#EEEBFF"/>
  <!-- thread from the paw, cut cleanly, then on to the yarn ball -->
  <path d="M300 214 C 318 196 330 196 338 206" fill="none" stroke="#FF6F91" stroke-width="5" stroke-linecap="round"/>
  <path d="M348 224 C 354 240 352 256 346 268" fill="none" stroke="#FF6F91" stroke-width="5" stroke-linecap="round"/>
  <!-- clean cut marks -->
  <path d="M334 222 L326 232 M346 206 L356 198 M352 214 H364" fill="none" stroke="#7B6CF6" stroke-width="4" stroke-linecap="round"/>
  <!-- yarn ball -->
  <circle cx="330" cy="326" r="52" fill="#FF6F91"/>
  <g fill="none" stroke="#EEEBFF" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <path d="M290 296 C 318 312 340 340 346 376"/>
    <path d="M300 284 C 334 300 364 330 372 356"/>
    <path d="M282 330 C 304 334 330 352 336 377"/>
    <path d="M352 280 C 330 300 312 330 310 374"/>
  </g>
  </g>
  <text x="440" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="96" font-weight="800" fill="#231F3A" text-anchor="start">graphemely</text>
  <rect x="444" y="160" width="120" height="8" rx="4" fill="#FF6F91"/>
  <text x="444" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#231F3A" text-anchor="start">Truncate, slice and count strings with emoji</text>
  <text x="444" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5B5675" text-anchor="start">safely in JavaScript and TypeScript. Grapheme clusters, zero deps.</text>

  <rect x="444" y="292" width="370" height="116" rx="18" fill="#FFFFFF" stroke="#E3DEFF" stroke-width="2"/>
  <text x="468" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="21" font-weight="400" fill="#5B5675" text-anchor="start">str.slice(0, 3)</text>
  <text x="468" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#231F3A" text-anchor="start">Hi</text>
  <g transform="translate(547 365)">
    <rect x="-15.12" y="-15.12" width="30.24" height="30.24" rx="4" transform="rotate(45)" fill="#FF6F91"/>
    <text x="0" y="8.82" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26.04" font-weight="800" fill="#FFFFFF">?</text>
  </g>
  <g transform="translate(778 322)"><circle r="14" fill="#FF6F91"/><path d="M-5 -5 L5 5 M5 -5 L-5 5" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/></g>
  <text x="590" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#FF6F91" text-anchor="start">broken</text>

  <rect x="838" y="292" width="400" height="116" rx="18" fill="#FFFFFF" stroke="#E3DEFF" stroke-width="2"/>
  <text x="862" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="21" font-weight="400" fill="#5B5675" text-anchor="start">slice(str, 0, 3)</text>
  <text x="862" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#231F3A" text-anchor="start">Hi</text>
  <g transform="translate(918 338) scale(0.8125)">
    <rect width="64" height="64" rx="14" fill="#EEEBFF"/>
    <circle cx="20" cy="21" r="7.5" fill="#7B6CF6"/>
    <path d="M9 52 Q9 33 20 33 Q31 33 31 52 Z" fill="#7B6CF6"/>
    <circle cx="44" cy="21" r="7.5" fill="#FF6F91"/>
    <path d="M33 52 Q33 33 44 33 Q55 33 55 52 Z" fill="#FF6F91"/>
    <circle cx="32" cy="38" r="5.5" fill="#231F3A"/>
    <path d="M24.5 58 Q24.5 46 32 46 Q39.5 46 39.5 58 Z" fill="#231F3A"/>
  </g>
  <g transform="translate(1202 322)"><circle r="14" fill="#22A06B"/><path d="M-6 0 L-1.5 5 L7 -5" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="988" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#22A06B" text-anchor="start">whole</text>
</svg>
