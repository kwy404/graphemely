  <g transform="translate(1212 190)"><circle r="14" fill="#22A06B"/><path d="M-6 0 L-1.5 5 L7 -5" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <rect x="40" y="246" width="580" height="80" rx="16" fill="#1F1B3D" stroke="#3A3566" stroke-width="2"/>
