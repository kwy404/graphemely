  <text x="412" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#F4F2FF" text-anchor="start">Hi</text><g transform="translate(481 283)">
