<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 564" width="1280" height="564" role="img" aria-labelledby="title desc">
  <title id="title">Before and after: native JavaScript string methods vs graphemely with emoji</title>
  <desc id="desc">For the string Hi, a family emoji and an exclamation mark: native length says 11 while graphemely says 4; native slice leaves a broken replacement character while graphemely keeps the family whole; a hand made truncate leaves one lonely person while graphemely truncate drops the emoji cleanly; split reverse join produces broken characters while graphemely reverse keeps the family intact.</desc>
  <rect width="1280" height="564" rx="28" fill="#14122A"/>
  <text x="40" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" font-weight="400" fill="#F4F2FF" text-anchor="start">const str = 'Hi' + family + '!'</text>
  <text x="510" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#B9B4D6" text-anchor="start">(family = man, woman, girl joined by zero width joiners)</text>
  <text x="40" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#FF6F91" text-anchor="start">Before: native string methods</text>
  <text x="660" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#22A06B" text-anchor="start">After: graphemely</text>
  
