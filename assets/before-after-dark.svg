  <text x="62" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" font-weight="400" fill="#B9B4D6" text-anchor="start">str.length</text>
  <text x="412" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#FF6F91" text-anchor="start">11</text>
  <g transform="translate(592 190)"><circle r="14" fill="#FF6F91"/><path d="M-5 -5 L5 5 M5 -5 L-5 5" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/></g>
  <rect x="660" y="150" width="580" height="80" rx="16" fill="#1F1B3D" stroke="#3A3566" stroke-width="2"/>
